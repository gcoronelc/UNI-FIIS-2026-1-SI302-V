<!doctype html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">

    <title>CONSULTAR PRECIO</title>
  </head>
  <body>
    
    <div class="">

        <h1>CONSULTAR PRECIO</h1>



        <form>
        <div class="form-group row">
            <label for="idcurso" class="col-sm-2 col-form-label">ID Curso</label>
            <div class="col-sm-10">
            <input type="text" class="form-control" id="idcurso" placeholder="Id Curso">
            </div>
        </div>
        <div class="form-group row">
            <label for="precio" class="col-sm-2 col-form-label">Precio</label>
            <div class="col-sm-10">
            <input type="text" class="form-control" id="precio" placeholder="precio" disabled>
            </div>
        </div>
        <div class="form-group row">
            <div class="col-sm-10 offset-sm-2">
            <button type="button" id="btnConsultar" class="btn btn-primary">Consultar</button>
            </div>
        </div>
        </form>

    </div>

    <!-- Optional JavaScript; choose one of the two! -->

    <!-- Option 1: jQuery and Bootstrap Bundle (includes Popper) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-Fy6S3B9q64WdZWQUiU+q4/2Lc9npb8tCaSX9FK7E8HnRr0Jz8D6OP9dO5Vg3Q9ct" crossorigin="anonymous"></script>

    <!-- Option 2: Separate Popper and Bootstrap JS -->
    <!--
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js" integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js" integrity="sha384-+sLIOodYLS7CIrQpBjl+C7nPvqq+FbNUBDunl/OZv93DB7Ln/533i8e/mZXLi/P+" crossorigin="anonymous"></script>
    -->

    <script>

        $(function() {
            $("#btnConsultar").click(fnClickConsultar);
        });


        function fnClickConsultar(){
            $("#precio").val("");
            var idCurso = $("#idcurso").val();
            var settings = {
            "url": "http://localhost:8080/api/v1/cursos/" + idCurso,
            "method": "GET",
            "timeout": 5000, // Cambiado de 0 a 5 segundos para evitar que la petición se quede colgada infinitamente
            };

            $.ajax(settings)
            .done(function (response) {
                // Se ejecuta solo si la respuesta es exitosa (HTTP status 200-299)
                console.log("Datos del curso:", response);
                $("#precio").val(response);
            })
            .fail(function (xhr, textStatus, errorThrown) {
                alert("Codigo no existe.");
            })
            .always(function () {
                // Se ejecuta siempre, ideal para ocultar spinners o indicadores de carga
                console.log("Petición finalizada.");
            });

        }

    </script>



  </body>
</html>
